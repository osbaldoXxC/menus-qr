services:
  postgres:
    container_name: mexxicanmx_db_prod
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR:-/mnt/ebs/postgres}:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - private-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis:
    image: redis:alpine
    volumes:
      - ${REDIS_DATA_DIR:-/mnt/ebs/redis}:/data
    networks:
      - private-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOCAL_MXN_BUDGET=false
      - DISABLE_STARTUP_DDL=false
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - ML_SERVICE_URL=http://ml-service:8000
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-oamdevsol-assets-256663926988}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN:-https://images.oamdevsol.site}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    networks:
      - public-net
      - private-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - uploads_data_prod:/app/uploads

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - public-net
      - private-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend-comensales:
    build:
      context: ./frontend-comensales
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
        VITE_PUBLIC_MENU_URL: ${VITE_PUBLIC_MENU_URL:-}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-}
        VITE_COMENSALES_URL: ${VITE_COMENSALES_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - public-net
    depends_on:
      - backend

  frontend-restaurantes:
    build:
      context: ./frontend-restaurantes
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
        VITE_PUBLIC_MENU_URL: ${VITE_PUBLIC_MENU_URL:-}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-}
        VITE_COMENSALES_URL: ${VITE_COMENSALES_URL:-}
    ports:
      - "${RESTAURANTES_PORT:-3002}:80"
    networks:
      - public-net
    depends_on:
      - backend

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - private-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    ports:
      - "${ADMIN_PORT:-3001}:80"
    networks:
      - public-net
    depends_on:
      - backend

volumes:
  uploads_data_prod:

networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge
    internal: true

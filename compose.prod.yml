services:
  postgres:
    container_name: mexxicanmx_db_prod
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR:-/mnt/ebs/postgres}:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - private-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis:
    image: redis:alpine
    volumes:
      - ${REDIS_DATA_DIR:-/mnt/ebs/redis}:/data
    networks:
      - private-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-oamdevsol-assets-256663926988}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN:-https://images.oamdevsol.site}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://app-ml-service-1:8000}
    volumes:
      - uploads_data_prod:/app/uploads
    networks:
      - public-net
      - private-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - public-net
      - private-net

  frontend-comensales:
    build:
      context: ./frontend-comensales
      dockerfile: Dockerfile.prod
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - public-net
    depends_on:
      - backend

  frontend-restaurantes:
    build:
      context: ./frontend-restaurantes
      dockerfile: Dockerfile.prod
    ports:
      - "${RESTAURANTES_PORT:-3002}:80"
    networks:
      - public-net
    depends_on:
      - backend

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - private-net
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
    ports:
      - "${ADMIN_PORT:-3001}:80"
    networks:
      - public-net
    depends_on:
      - backend

volumes:
  uploads_data_prod:

networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge
    internal: true

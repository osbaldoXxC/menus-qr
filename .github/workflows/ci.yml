name: MexxicanMX CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verificar manifiestos y Compose
        run: |
          node -e "for (const p of ['backend','frontend-comensales','frontend-restaurantes','admin']) { require('./'+p+'/package.json'); require('./'+p+'/package-lock.json'); }"
          printf '%s\n' 'POSTGRES_USER=ci' 'POSTGRES_PASSWORD=ci_only' 'POSTGRES_DB=ci' 'DATABASE_URL=postgresql://ci:ci_only@postgres:5432/ci' 'REDIS_URL=redis://redis:6379' 'JWT_SECRET=synthetic-ci-secret' 'REFRESH_TOKEN_SECRET=synthetic-ci-refresh' > .env
          docker compose config --quiet
          docker compose -f compose.prod.yml config --quiet
          docker compose -f ci/compose.integration.yaml config --quiet
          docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml config --quiet
          docker compose -f ci/compose.persistence.yaml config --quiet
      - name: Validar workflow con actionlint verificado
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Detectar runtimes sin soporte
        run: python3 ci/check-supported-runtimes.py

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.5'
      - name: Verificar sintaxis JavaScript
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

  backend-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Todas las pruebas unitarias
        env:
          NODE_ENV: test
        run: node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=unit-junit.xml tests/unit/*.test.js
      - run: python3 ../ci/require-no-skips.py unit-junit.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: backend-unit-junit
          path: backend/unit-junit.xml
          if-no-files-found: warn

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [admin, frontend-comensales, frontend-restaurantes]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pruebas disponibles del frontend
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          case "$APP_NAME" in
            frontend-comensales) node --test tests/search-flow.test.cjs ;;
            frontend-restaurantes) node --test tests/r4-components.test.cjs ;;
            admin) echo 'No existen pruebas automatizadas de admin; cobertura pendiente.' ;;
          esac

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: python -m pip install -r ml-service/requirements.txt pytest==9.2.0
      - name: Todas las pruebas Python de ML
        working-directory: ml-service
        run: python -m pytest tests --junitxml=ml-junit.xml
      - run: python ci/require-no-skips.py ml-service/ml-junit.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ml-junit
          path: ml-service/ml-junit.xml
          if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: backend, context: backend, file: backend/Dockerfile}
          - {name: ml, context: ml-service, file: ml-service/Dockerfile}
          - {name: ai, context: ai-engine, file: ai-engine/Dockerfile}
          - {name: ai-dev, context: ai-engine, file: ai-engine/Dockerfile.dev}
          - {name: diners-dev, context: frontend-comensales, file: frontend-comensales/Dockerfile.dev}
          - {name: diners-prod, context: frontend-comensales, file: frontend-comensales/Dockerfile.prod}
          - {name: restaurants-dev, context: frontend-restaurantes, file: frontend-restaurantes/Dockerfile.dev}
          - {name: restaurants-prod, context: frontend-restaurantes, file: frontend-restaurantes/Dockerfile.prod}
          - {name: admin-dev, context: admin, file: admin/Dockerfile}
          - {name: admin-prod, context: admin, file: admin/Dockerfile.prod}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Construir imagen sin publicar
        env:
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.file }}
          IMAGE_NAME: ${{ matrix.name }}
        run: docker build --file "$DOCKERFILE" --tag "mexxicanmx-ci-$IMAGE_NAME:$GITHUB_SHA" "$CONTEXT"

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: ci-integration-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Iniciar servicios sintéticos y comprobar salud
        run: docker compose -f ci/compose.integration.yaml up -d --build --wait --wait-timeout 360
      - name: Contrato HTTP DEC-012 y ML real
        run: docker compose -f ci/compose.integration.yaml exec -T backend node --test --test-reporter=junit /app/tests/integration/dec012-isolated/http.test.js > dec012-junit.xml
      - name: Persistencia, validación y aislamiento B1
        run: docker compose -f ci/compose.integration.yaml exec -T backend node --test --test-reporter=junit --test-concurrency=1 /app/tests/integration/b1t02Validation.integration.test.js /app/tests/integration/b1t04Postgres.integration.test.js /app/tests/integration/b1t05Isolation.integration.test.js > b1-junit.xml
      - name: Preferencias y restricciones textuales
        run: docker compose -f ci/compose.integration.yaml exec -T backend node --test --test-reporter=junit /app/tests/integration/r3-isolated/natural.test.cjs > natural-junit.xml
      - run: python3 ci/require-no-skips.py dec012-junit.xml b1-junit.xml natural-junit.xml
      - name: Guardar logs sintéticos
        if: always()
        run: docker compose -f ci/compose.integration.yaml logs --no-color --tail=100 > integration-services.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: backend-integration-logs
          path: |
            integration-services.log
            *-junit.xml
          if-no-files-found: warn
      - name: Retirar únicamente servicios temporales
        if: always()
        run: docker compose -f ci/compose.integration.yaml down

  docker-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: ci-persistence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verificar persistencia aislada tras reinicio
        run: bash ci/test-persistence.sh
      - name: Retirar contenedores temporales sin borrar volúmenes
        if: always()
        run: docker compose -f ci/compose.persistence.yaml down

  r3-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: ci-r3-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Iniciar R3 en PostgreSQL temporal con migraciones sintéticas
        run: docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml up -d --build --wait --wait-timeout 360
      - name: Confirmación, alcance, revocación y concurrencia
        run: docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml exec -T backend node --test --test-reporter=junit /app/tests/integration/r3-isolated/real.test.cjs > r3-real-junit.xml
      - name: Integridad de PostgreSQL
        run: docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml exec -T backend node --test --test-reporter=junit /app/tests/integration/r3-isolated/integrity.test.cjs > r3-integrity-junit.xml
      - name: Flujo autenticado de propietario
        run: docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml exec -T backend node --test --test-reporter=junit /app/tests/integration/r3-isolated/owner-flow.test.cjs > r3-owner-junit.xml
      - run: python3 ci/require-no-skips.py r3-real-junit.xml r3-integrity-junit.xml r3-owner-junit.xml
      - name: Guardar logs sintéticos
        if: always()
        run: docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml logs --no-color --tail=100 > r3-services.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: r3-integration-logs
          path: |
            r3-services.log
            r3-*-junit.xml
          if-no-files-found: warn
      - name: Retirar únicamente servicios temporales
        if: always()
        run: docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml down

  integration-existing-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: ci-all-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Iniciar PostgreSQL y ML sintéticos con R3
        run: docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml up -d --build --wait --wait-timeout 360
      - name: Ejecutar todos los archivos de integración y detectar omisiones
        run: |
          set -o pipefail
          docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml exec -T \
            -e R3_INTEGRATION_AUTHORIZED=yes \
            -e R3_TEST_DATABASE_URL=postgresql://ci_test:ci_synthetic_only@postgres:5432/r3_test_isolated \
            backend sh -c 'find /app/tests/integration -type f \( -name "*.test.js" -o -name "*.test.cjs" \) -print | sort | xargs node --test --test-concurrency=1' | tee all-integration.tap
          if grep -Eiq '# (skip|skipped) [^0]|# SKIP' all-integration.tap; then
            echo 'Una prueba de integración fue omitida: revisar el inventario y sus prerrequisitos.'
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: all-integration-results
          path: all-integration.tap
          if-no-files-found: warn
      - name: Retirar únicamente servicios temporales
        if: always()
        run: docker compose -f ci/compose.integration.yaml -f ci/compose.r3.yaml down

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      CI_FRONTEND_URL: http://127.0.0.1:43010
      VITE_API_URL: http://127.0.0.1:43000/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: frontend-comensales/package-lock.json
      - name: Iniciar backend y datos sintéticos
        run: docker compose -f ci/compose.integration.yaml up -d --build --wait --wait-timeout 360
      - name: Instalar dependencias y navegador de prueba
        working-directory: frontend-comensales
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Iniciar frontend aislado
        working-directory: frontend-comensales
        run: |
          npm run dev -- --host 127.0.0.1 --port 43010 --strictPort > "$RUNNER_TEMP/vite-ci.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:43010/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vite-ci.log"
          exit 1
      - name: Ejecutar todas las pruebas E2E existentes
        working-directory: frontend-comensales
        run: npx playwright test --config=playwright.ci.config.ts --project=chromium
      - run: python3 ci/require-no-skips.py frontend-comensales/test-results/ci-junit.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: playwright-results
          path: frontend-comensales/test-results/
          if-no-files-found: warn
      - name: Guardar logs y retirar servicios temporales
        if: always()
        run: |
          docker compose -f ci/compose.integration.yaml logs --no-color --tail=100
          docker compose -f ci/compose.integration.yaml down

  ci-summary:
    if: always()
    needs: [repository-validation, security-baseline, backend-quality, backend-unit-tests, frontend-tests, python-tests, docker-build, backend-integration, docker-persistence, r3-integration, integration-existing-suite, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resumir y exigir todos los trabajos
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os,sys; x=json.loads(os.environ["NEEDS_JSON"]); [print("{}: {}".format(k,v["result"])) for k,v in x.items()]; sys.exit(any(v["result"] != "success" for v in x.values()))'

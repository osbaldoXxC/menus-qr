AWSTemplateFormatVersion: '2010-09-09'
Description: 'Stack 4 - IAM: Rol de IAM e Instance Profile para la instancia EC2'

Parameters:
  EnvironmentName:
    Type: String
    Default: oamdevsol

Resources:
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ec2-role-${AWS::AccountId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: !Sub '${EnvironmentName}-ec2-s3-access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: '*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${EnvironmentName}-ec2-profile-${AWS::AccountId}'
      Roles:
        - !Ref EC2Role

Outputs:
  EC2RoleArn:
    Description: ARN del Rol IAM para EC2
    Value: !GetAtt EC2Role.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EC2RoleArn'

  EC2InstanceProfileName:
    Description: Nombre del Instance Profile para EC2
    Value: !Ref EC2InstanceProfile
    Export:
      Name: !Sub '${AWS::StackName}-EC2InstanceProfileName'

  EC2InstanceProfileArn:
    Description: ARN del Instance Profile para EC2
    Value: !GetAtt EC2InstanceProfile.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EC2InstanceProfileArn'

AWSTemplateFormatVersion: '2010-09-09'
Description: 'Stack 1 - Networking: VPC, Subnets, IGW, Route Tables y Security Groups para MexxicanMX'

Parameters:
  EnvironmentName:
    Type: String
    Default: oamdevsol
    Description: Nombre del entorno (usado para prefijos de recursos)

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Bloque CIDR para la VPC

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: Bloque CIDR para la Subnet Pública

  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    Description: IP o rango CIDR permitido para acceso SSH (Puerto 22). Se recomienda limitar a tu IP actual.

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security Group para EC2 en ${EnvironmentName} (Puertos 80, 443, 22)'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'HTTP Web Access'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS Web Access'
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
          Description: 'SSH Management Access'
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          CidrIp: 0.0.0.0/0
          Description: 'Node.js Backend API Access'
      # NOTA: NO SE ABREN LOS PUERTOS 5432 (PostgreSQL) NI 6379 (Redis). 
      # Permanecen totalmente aislados dentro de la red privada de Docker.
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ec2-sg'

Outputs:
  VPCId:
    Description: ID de la VPC creada
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPCId'

  PublicSubnetId:
    Description: ID de la Subnet Pública
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId'

  PublicSubnetAZ:
    Description: Zona de disponibilidad de la Subnet Pública
    Value: !GetAtt PublicSubnet.AvailabilityZone
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetAZ'

  EC2SecurityGroupId:
    Description: ID del Security Group para EC2
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-EC2SecurityGroupId'

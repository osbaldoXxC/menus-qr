services:
  postgres:
    image: sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_USER: r3_test
      POSTGRES_PASSWORD: r3_synthetic_only
      POSTGRES_DB: r3_test_isolated
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../../src/db/init.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ../dec012-isolated/fixtures.sql:/docker-entrypoint-initdb.d/02-synthetic.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U r3_test -d r3_test_isolated"]
      interval: 3s
      timeout: 3s
      retries: 40
  postgres-rollback:
    image: sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_USER: r3_test
      POSTGRES_PASSWORD: r3_synthetic_only
      POSTGRES_DB: r3_test_rollback
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../../src/db/init.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U r3_test -d r3_test_rollback"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: [redis-server, --save, "", --appendonly, "no"]
    tmpfs: [/data]
  ml:
    image: sha256:823a2cfb7b28eb109af3e277377eb005446c61c39dd1530d4d19dbedf1c84992
    volumes:
      - ../../../../ml-service/main.py:/app/main.py:ro
      - ../../../../ml-service/linguistic.py:/app/linguistic.py:ro
      - ../../../../shared:/app/shared:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 4s
      retries: 30
  ml-proxy:
    image: sha256:35a336c7d31a098c279dd04729bd00458f634b1d7f8b3e71ea858b8a721e8c68
    command: [node, /app/r3-tests/ml-proxy.cjs]
    volumes:
      - .:/app/r3-tests:ro
    depends_on:
      ml: { condition: service_healthy }
  backend:
    image: sha256:35a336c7d31a098c279dd04729bd00458f634b1d7f8b3e71ea858b8a721e8c68
    environment: &env
      NODE_ENV: test
      DATABASE_URL: postgresql://r3_test:r3_synthetic_only@postgres:5432/r3_test_isolated
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-proxy:8010
      JWT_SECRET: r3-isolated-synthetic-secret
      REFRESH_TOKEN_SECRET: r3-isolated-synthetic-secret
      PORT: 4000
    volumes:
      - ../../../src:/app/src:ro
      - .:/app/r3-tests:ro
      - ../../../../shared:/app/shared:ro
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_healthy }
      ml-proxy: { condition: service_started }
  backend-fallback:
    image: sha256:35a336c7d31a098c279dd04729bd00458f634b1d7f8b3e71ea858b8a721e8c68
    environment:
      <<: *env
      ML_SERVICE_URL: http://127.0.0.1:1
      ML_SERVICE_TIMEOUT: 1000
    volumes:
      - ../../../src:/app/src:ro
      - ../../../../shared:/app/shared:ro
    depends_on:
      postgres: { condition: service_healthy }
networks:
  default:
    internal: true
